<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wordle Clone</title>
  <style>
    body {
      background: #121213;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 30px 10px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .tile {
      width: 60px;
      height: 60px;
      border: 2px solid #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      background-color: #121213;
      transition: 0.3s;
    }

    .correct {
      background-color: #538d4e;
      border-color: #538d4e;
      color: white;
    }

    .present {
      background-color: #b59f3b;
      border-color: #b59f3b;
      color: white;
    }

    .absent {
      background-color: #3a3a3c;
      border-color: #3a3a3c;
      color: white;
    }

    #message {
      height: 24px;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
    }

    .keyboard-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .key {
      padding: 10px;
      background-color: #818384;
      color: white;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      min-width: 40px;
      height: 58px;
      text-transform: uppercase;
      transition: 0.2s ease;
      user-select: none;
    }

    .key.wide {
      min-width: 60px;
    }

    .key.correct {
      background-color: #538d4e;
    }

    .key.present {
      background-color: #b59f3b;
    }

    .key.absent {
      background-color: #3a3a3c;
    }

    #restart {
      margin-top: 10px;
      padding: 10px 20px;
      background: #3a3a3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    #restart:hover {
      background: #4a4a4c;
    }
  </style>
</head>
<body>
  <h1>My Wordle</h1>
  <div id="board"></div>
  <div id="message"></div>
  <div id="keyboard"></div>
  <button id="restart">🔁 Restart</button>

  <script>
    const wordList = ['apple', 'grape', 'light', 'bloom', 'spoon', 'track', 'crane', 'proud'];
    let targetWord = "";
    let currentRow, currentCol, guesses;

    const maxRows = 6;
    const maxCols = 5;
    const board = document.getElementById("board");
    const message = document.getElementById("message");
    const keyboard = document.getElementById("keyboard");
    const restartBtn = document.getElementById("restart");

    const keyboardRows = [
      [..."qwertyuiop"],
      [..."asdfghjkl"],
      ["Enter", ..."zxcvbnm", "Backspace"]
    ];

    function initGame() {
      board.innerHTML = "";
      keyboard.innerHTML = "";
      message.textContent = "";

      targetWord = wordList[Math.floor(Math.random() * wordList.length)];
      currentRow = 0;
      currentCol = 0;
      guesses = Array.from({ length: maxRows }, () => Array(maxCols).fill(''));

      for (let r = 0; r < maxRows; r++) {
        const row = document.createElement("div");
        row.classList.add("row");
        for (let c = 0; c < maxCols; c++) {
          const tile = document.createElement("div");
          tile.classList.add("tile");
          row.appendChild(tile);
        }
        board.appendChild(row);
      }

      keyboardRows.forEach(rowKeys => {
        const rowDiv = document.createElement("div");
        rowDiv.classList.add("keyboard-row");

        rowKeys.forEach(key => {
          const keyBtn = document.createElement("button");
          keyBtn.textContent = key === "Backspace" ? "⌫" : key;
          keyBtn.classList.add("key");
          if (key === "Enter" || key === "Backspace") keyBtn.classList.add("wide");
          keyBtn.dataset.key = key;
          rowDiv.appendChild(keyBtn);
        });

        keyboard.appendChild(rowDiv);
      });
    }

    function handleKey(key) {
      if (currentRow >= maxRows) return;

      if (key === "Enter") {
        if (currentCol < maxCols) {
          showMessage("Not enough letters");
          return;
        }
        checkGuess();
      } else if (key === "Backspace") {
        if (currentCol > 0) {
          currentCol--;
          guesses[currentRow][currentCol] = '';
          updateBoard();
        }
      } else if (/^[a-zA-Z]$/.test(key) && currentCol < maxCols) {
        guesses[currentRow][currentCol] = key.toLowerCase();
        updateBoard();
        currentCol++;
      }
    }

    function updateBoard() {
      const rowDiv = board.children[currentRow];
      for (let i = 0; i < maxCols; i++) {
        rowDiv.children[i].textContent = guesses[currentRow][i] || '';
      }
    }

    function checkGuess() {
      const guess = guesses[currentRow].join('');
      const rowDiv = board.children[currentRow];
      const targetLetters = targetWord.split('');
      const result = Array(maxCols).fill("absent");
      const guessLetters = guess.split('');

      for (let i = 0; i < maxCols; i++) {
        if (guessLetters[i] === targetLetters[i]) {
          result[i] = "correct";
          targetLetters[i] = null;
        }
      }

      for (let i = 0; i < maxCols; i++) {
        if (result[i] !== "correct") {
          const idx = targetLetters.indexOf(guessLetters[i]);
          if (idx !== -1) {
            result[i] = "present";
            targetLetters[idx] = null;
          }
        }
      }

      for (let i = 0; i < maxCols; i++) {
        const tile = rowDiv.children[i];
        const keyBtn = keyboard.querySelector(`[data-key="${guessLetters[i]}"]`);
        tile.classList.add(result[i]);

        if (keyBtn) {
          if (!keyBtn.classList.contains("correct")) {
            if (result[i] === "correct") {
              keyBtn.className = "key correct";
            } else if (result[i] === "present" && !keyBtn.classList.contains("present")) {
              keyBtn.className = "key present";
            } else if (!keyBtn.classList.contains("present")) {
              keyBtn.className = "key absent";
            }
          }
        }
      }

      if (guess === targetWord) {
        showMessage("🎉 You guessed it!");
      } else {
        currentRow++;
        currentCol = 0;
        if (currentRow === maxRows) {
          showMessage("Game over! The word was: " + targetWord.toUpperCase());
        }
      }
    }

    function showMessage(text) {
      message.textContent = text;
      setTimeout(() => (message.textContent = ''), 2500);
    }

    document.addEventListener("keydown", e => {
      handleKey(e.key);
    });

    keyboard.addEventListener("click", e => {
      if (e.target.matches("button")) {
        handleKey(e.target.dataset.key);
      }
    });

    restartBtn.addEventListener("click", initGame);

    initGame();
  </script>
</body>
</html>
